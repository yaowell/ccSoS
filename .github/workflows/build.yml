name: Build SimpleCowbell Rootless

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ldid via Homebrew
        run: |
          brew install ldid

      - name: Setup Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          
          # 將 brew 安裝的 ldid 軟連結至 Theos 目錄，確保百分之百調用成功
          ln -sf $(which ldid) ~/theos/bin/ldid
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Tweak Package
        run: |
          make clean
          make package ROOTLESS=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCowbell-deb
          path: packages/*.deb

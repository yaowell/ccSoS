name: Build SimpleCowbell Rootless

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos & SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential libplist-dev dpkg
          git clone https://github.com/theos/theos.git --depth 1 /opt/theos
          curl -sS https://raw.githubusercontent.com/theos/dm.pl/master/dm.pl -o /opt/theos/bin/dm.pl
          chmod +x /opt/theos/bin/dm.pl
          
          # 下載 iOS SDK 補全編譯環境
          curl -LO https://github.com/theos/sdks/releases/download/v16.5/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz
          mv iPhoneOS16.5.sdk /opt/theos/sdks/
          rm iPhoneOS16.5.sdk.tar.xz
          
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Build Tweak Package
        run: |
          export THEOS=/opt/theos
          make clean
          make package ROOTLESS=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCowbell-deb
          path: packages/*.deb

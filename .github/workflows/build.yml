name: Build SimpleCowbell Rootless Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup‑Theos official action
        uses: theos/setup-theos@v1

      - name: Build & package rootless
        run: |
          make clean
          make package ROOTLESS=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
          name: SimpleCowbell-deb
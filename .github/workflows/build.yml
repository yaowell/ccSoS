name: Build SimpleCowbell Rootless

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: theos/sdks@master
        with:
          path: /opt/theos

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libplist-dev dpkg curl
          curl -sS https://raw.githubusercontent.com/theos/dm.pl/master/dm.pl -o /opt/theos/bin/dm.pl
          chmod +x /opt/theos/bin/dm.pl
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Build Tweak Package
        run: |
          export THEOS=/opt/theos
          make clean
          make package ROOTLESS=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCowbell-deb
          path: packages/*.deb

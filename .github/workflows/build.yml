name: Build SimpleCowbell Rootless Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Rootless‑Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential libplist-dev
          git clone https://github.com/sbingner/theos.git --depth 1 /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Compile tweak ROOTLESS=1
        run: |
          make clean
          make package ROOTLESS=1

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
          name: SimpleCowbell-deb
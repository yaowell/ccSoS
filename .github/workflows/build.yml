name: Build SimpleCowbell Rootless Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential libplist-dev perl
          export THEOS=/opt/theos
          git clone https://github.com/theos/theos.git $THEOS
          cd $THEOS
          ./install.sh
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Compile ROOTLESS=1
        run: |
          make clean
          make package ROOTLESS=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
          name: SimpleCowbell-deb
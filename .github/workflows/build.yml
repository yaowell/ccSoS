name: Build SimpleCowbell Rootless

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos & SDKs
        run: |
          # 1. 克隆 Theos 本體
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          # 2. 下載完整的 iOS SDKs 庫 (修復 SDK 不存在問題)
          rm -rf ~/theos/sdks
          git clone https://github.com/theos/sdks.git ~/theos/sdks
          
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Tweak Package
        run: |
          make clean
          make package ROOTLESS=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCowbell-deb
          path: packages/*.deb

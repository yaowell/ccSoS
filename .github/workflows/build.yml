name: Build SimpleCowbell Rootless

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential libplist-dev
          git clone https://github.com/theos/theos.git --depth 1 /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Build Tweak Package
        run: |
          export THEOS=/opt/theos
          make clean
          make package ROOTLESS=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleCowbell-deb
          path: packages/*.deb
